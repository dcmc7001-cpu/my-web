backend:
  name: git-gateway
  branch: main

media_folder: "images" 
public_folder: "/images"

collections:
  - name: "store_inventory"
    label: "Store Inventory"
    files:
      - label: "Manage Thrift Items"
        name: "items"
        file: "inventory.json"
        fields:
          - label: "Your Items"
            name: "thrift_items"
            widget: "list"
            fields:
              - {label: "Item Name", name: "title", widget: "string"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
